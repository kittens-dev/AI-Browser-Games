<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>СОБОР ТЬМЫ</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none}
body{display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 38%,#160d07 0%,#000 72%)}
#screen{image-rendering:pixelated;image-rendering:crisp-edges;display:block;
 box-shadow:0 0 0 2px #2a1c10,0 0 70px #000,0 0 150px rgba(130,55,12,.20);cursor:none}
#wrap{position:relative;line-height:0}
</style>
</head>
<body>
<div id="wrap"><canvas id="screen" width="960" height="600"></canvas></div>
<script>
'use strict';
(function(){
/* ═══════════════════════════════════════════════════════════════
   СОБОР ТЬМЫ · вариант без арок: свободно стоящие колонны
   объёмные сундуки ( closed: сводчатая крышка / open: гора монет )
   без красных щитов-знамён на стенах
   ═══════════════════════════════════════════════════════════════ */
var HQ=(Math.min(innerWidth,innerHeight)>=560)&&!/Mobi|Android/i.test(navigator.userAgent);
var VW=960,VH=600,VIEW_H=452,PANEL_Y=452;
var TW=96,TH=48,HW=48,HH=24,WALLH=96,PITD=40,PLATH=30;
var MW=48,MH=48,SS=HQ?1.5:1.15,TAU=6.283185;
var COL_TOP=112,ROUND=26,ABACUS=.44,PLINTH=.48;
var out=document.getElementById('screen'),octx=out.getContext('2d');
var buf=document.createElement('canvas');buf.width=VW;buf.height=VH;
var g=buf.getContext('2d');
var scratch=document.createElement('canvas');scratch.width=256;scratch.height=256;
var sg=scratch.getContext('2d');
octx.imageSmoothingEnabled=false;g.imageSmoothingEnabled=false;sg.imageSmoothingEnabled=false;
function fit(){var s=Math.min(innerWidth/VW,innerHeight/VH);if(s>=1)s=Math.max(1,Math.floor(s*2)/2);
 out.style.width=(VW*s)+'px';out.style.height=(VH*s)+'px';}
fit();addEventListener('resize',fit);

var rnd=function(a,b){return a+Math.random()*(b-a)};
var ri=function(a,b){return Math.floor(a+Math.random()*(b-a+1))};
var pick=function(a){return a[ri(0,a.length-1)]};
var cl=function(v,a,b){return v<a?a:(v>b?b:v)};
var hyp=function(x,y){return Math.sqrt(x*x+y*y)};
function hex(c){
 if(typeof c!=='string')return [130,124,116];
 if(c.charAt(0)==='#'){
  if(c.length===4)return [parseInt(c[1]+c[1],16),parseInt(c[2]+c[2],16),parseInt(c[3]+c[3],16)];
  return [parseInt(c.substr(1,2),16)||0,parseInt(c.substr(3,2),16)||0,parseInt(c.substr(5,2),16)||0];}
 var m=c.match(/-?\d+(\.\d+)?/g);
 if(m&&m.length>=3)return [+m[0],+m[1],+m[2]];
 return [130,124,116];
}
function rgb(r,gg,b){return 'rgb('+cl(Math.round(r),0,255)+','+cl(Math.round(gg),0,255)+','+cl(Math.round(b),0,255)+')';}
function lit(c,f){var v=hex(c),w=f<1?(1-f)*8:0;return rgb(v[0]*f+w,v[1]*f+w*.5,v[2]*f);}
function mk(w,h){var c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function ctx2(cv){return cv.getContext('2d',{willReadFrequently:true});}
var BAY=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
function dither(cv,warm){
 var c=ctx2(cv),d=c.getImageData(0,0,cv.width,cv.height),p=d.data,W=cv.width;
 for(var i=0;i<p.length;i+=4){
  if(p[i+3]<8)continue;
  var px=(i>>2)%W,py=(i>>2)/W|0,th=(BAY[py&3][px&3]/16-.5)*15;
  var r=p[i],gg=p[i+1],b=p[i+2],lum=(r+gg+b)/3;
  r=r*.93+lum*.07+(warm||0);gg=gg*.93+lum*.07;b=b*.93+lum*.07;
  p[i]=cl(Math.round((r+th)/32)*32,0,255);
  p[i+1]=cl(Math.round((gg+th)/32)*32,0,255);
  p[i+2]=cl(Math.round((b+th)/32)*32,0,255);}
 c.putImageData(d,0,0);return cv;
}

/* ══════════ ПЕРИОДИЧЕСКИЙ КАМЕНЬ ══════════ */
function wrapNoise(gx,gy){
 var grid=[],j,i;
 for(j=0;j<gy;j++){grid[j]=[];for(i=0;i<gx;i++)grid[j][i]=Math.random();}
 return function(u,v){
  var fx=u*gx,fy=v*gy;
  var i0=Math.floor(fx)%gx,j0=Math.floor(fy)%gy;
  if(i0<0)i0+=gx; if(j0<0)j0+=gy;
  var i1=(i0+1)%gx,j1=(j0+1)%gy;
  var tx=fx-Math.floor(fx),ty=fy-Math.floor(fy);
  var sx=tx*tx*(3-2*tx),sy=ty*ty*(3-2*ty);
  var a=grid[j0][i0]+(grid[j0][i1]-grid[j0][i0])*sx;
  var b=grid[j1][i0]+(grid[j1][i1]-grid[j1][i0])*sx;
  return a+(b-a)*sy;};
}
function stoneTexture(base,lo,hi){
 var cv=mk(TW,TH),x=ctx2(cv),img=x.createImageData(TW,TH),p=img.data;
 var n1=wrapNoise(6,3),n2=wrapNoise(12,6),n3=wrapNoise(24,12),n4=wrapNoise(48,24);
 var c=hex(base);
 for(var v=0;v<TH;v++)for(var u=0;u<TW;u++){
  var uu=u/TW,vv=v/TH;
  var n=n1(uu,vv)*.46+n2(uu,vv)*.28+n3(uu,vv)*.17+n4(uu,vv)*.09;
  var f=lo+(hi-lo)*n;
  var idx=(v*TW+u)*4;
  p[idx]=cl(c[0]*f,0,255);p[idx+1]=cl(c[1]*f,0,255);p[idx+2]=cl(c[2]*f,0,255);p[idx+3]=255;}
 x.putImageData(img,0,0);
 return dither(cv,2);
}
function phaseTiles(tex){
 var src=ctx2(tex).getImageData(0,0,TW,TH).data,res=[];
 for(var py=0;py<2;py++)for(var px=0;px<2;px++){
  var cv=mk(TW,TH),x=ctx2(cv),img=x.createImageData(TW,TH),p=img.data;
  var ox=px*HW,oy=py*HH;
  for(var v=0;v<TH;v++)for(var u=0;u<TW;u++){
   var du=Math.abs(u-HW)/HW,dv=Math.abs(v-HH)/HH;
   var idx=(v*TW+u)*4;
   if(du+dv>1.0001){p[idx+3]=0;continue;}
   var su=(u+ox)%TW,sv=(v+oy)%TH,si=(sv*TW+su)*4;
   p[idx]=src[si];p[idx+1]=src[si+1];p[idx+2]=src[si+2];p[idx+3]=255;}
  x.putImageData(img,0,0);res.push(cv);}
 return res;
}
function phaseOf(x,y){
 var a=((x-y)%2+2)%2,b=((x+y)%2+2)%2;
 return b*2+a;
}

/* ══════════ ОБЪЁМЫ ══════════ */
function isoP(x,cx,cy,i,j,z){return [cx+(i-j)*HW,cy+(i+j)*HH-z];}
function faceShade(nx,ny){return .56+.34*cl((ny-nx)*.7071,-1,1);}
function polyFill(x,P,fill,stroke,lw){
 x.beginPath();x.moveTo(P[0][0],P[0][1]);
 for(var i=1;i<P.length;i++)x.lineTo(P[i][0],P[i][1]);
 x.closePath();
 if(fill){x.fillStyle=fill;x.fill();}
 if(stroke){x.strokeStyle=stroke;x.lineWidth=lw||1;x.stroke();}
}
function sqBlock(x,cx,cy,i,j,z0,z1,a,col,bevel){
 var A=[i-a,j-a],Bv=[i+a,j-a],C=[i+a,j+a],D=[i-a,j+a];
 function q(p,z){return isoP(x,cx,cy,p[0],p[1],z);}
 var R=[q(Bv,z0),q(C,z0),q(C,z1),q(Bv,z1)];
 var gr=x.createLinearGradient(R[0][0],R[0][1],R[3][0],R[3][1]);
 gr.addColorStop(0,lit(col,.30));gr.addColorStop(1,lit(col,.46));
 polyFill(x,R,gr,null);
 var L=[q(D,z0),q(C,z0),q(C,z1),q(D,z1)];
 var gl=x.createLinearGradient(L[0][0],L[0][1],L[3][0],L[3][1]);
 gl.addColorStop(0,lit(col,.66));gl.addColorStop(1,lit(col,.90));
 polyFill(x,L,gl,null);
 var T=[q(A,z1),q(Bv,z1),q(C,z1),q(D,z1)];
 var tg=x.createLinearGradient(T[0][0],T[0][1],T[2][0],T[2][1]);
 tg.addColorStop(0,lit(col,1.20));tg.addColorStop(1,lit(col,1.02));
 polyFill(x,T,tg,null);
 if(bevel){
  x.strokeStyle=lit(col,1.36);x.lineWidth=1.3;
  x.beginPath();x.moveTo(T[3][0],T[3][1]);x.lineTo(T[2][0],T[2][1]);x.lineTo(T[1][0],T[1][1]);x.stroke();
  x.strokeStyle='rgba(0,0,0,.16)';x.lineWidth=1;
  x.beginPath();x.moveTo(L[0][0],L[0][1]);x.lineTo(L[1][0],L[1][1]);x.lineTo(R[0][0],R[0][1]);x.stroke();}
}
function isoBox(x,cx,cy,i,j,z0,z1,ai,aj,col){
 var A=[i-ai,j-aj],Bv=[i+ai,j-aj],C=[i+ai,j+aj],D=[i-ai,j+aj];
 function q(p,z){return isoP(x,cx,cy,p[0],p[1],z);}
 var R=[q(Bv,z0),q(C,z0),q(C,z1),q(Bv,z1)];
 var gr=x.createLinearGradient(R[0][0],R[0][1],R[3][0],R[3][1]);
 gr.addColorStop(0,lit(col,.30));gr.addColorStop(1,lit(col,.46));
 polyFill(x,R,gr,null);
 var Lf=[q(D,z0),q(C,z0),q(C,z1),q(D,z1)];
 var gl=x.createLinearGradient(Lf[0][0],Lf[0][1],Lf[3][0],Lf[3][1]);
 gl.addColorStop(0,lit(col,.66));gl.addColorStop(1,lit(col,.90));
 polyFill(x,Lf,gl,null);
 var T=[q(A,z1),q(Bv,z1),q(C,z1),q(D,z1)];
 polyFill(x,T,lit(col,1.12),null);
}
/* сводчатая крышка: полуцилиндр вдоль оси i */
function vault(x,cx,cy,z0,hgt,ai,aj,col,seg){
 var k,prev=null;
 for(k=0;k<=seg;k++){
  var t=k/seg,j=-aj+2*aj*t;
  var z=z0+hgt*Math.sqrt(Math.max(0,1-(j/aj)*(j/aj)));
  var cur=[j,z];
  if(prev){
   var p1=isoP(x,cx,cy,-ai,prev[0],prev[1]),p2=isoP(x,cx,cy,ai,prev[0],prev[1]);
   var p3=isoP(x,cx,cy,ai,cur[0],cur[1]),p4=isoP(x,cx,cy,-ai,cur[0],cur[1]);
   var nj=cur[0]-prev[0],nz=cur[1]-prev[1],nl=Math.hypot(nj,nz)||1;
   nj/=nl;nz/=nl;
   var br=cl(.45+.55*nz+.28*nj,.35,1.45);
   polyFill(x,[p1,p2,p3,p4],lit(col,br),null);}
  prev=cur;}
 x.beginPath();
 for(k=0;k<=seg;k++){
  var t2=k/seg,j2=-aj+2*aj*t2,z2=z0+hgt*Math.sqrt(Math.max(0,1-(j2/aj)*(j2/aj)));
  var q=isoP(x,cx,cy,ai,j2,z2);
  if(k===0)x.moveTo(q[0],q[1]);else x.lineTo(q[0],q[1]);}
 var qA=isoP(x,cx,cy,ai,aj,z0),qB=isoP(x,cx,cy,ai,-aj,z0);
 x.lineTo(qA[0],qA[1]);x.lineTo(qB[0],qB[1]);x.closePath();
 x.fillStyle=lit(col,.78);x.fill();
}
function lathe(x,cx,cy,z0,z1,r0,r1,col,n){
 n=n||ROUND;
 var k,faces=[];
 for(k=0;k<n;k++){
  var a0=k/n*TAU,a1=(k+1)/n*TAU,am=(a0+a1)/2;
  var nx=Math.cos(am),ny=Math.sin(am);
  if(nx+ny<=-.02)continue;
  faces.push({d:nx+ny,b:faceShade(nx,ny),
   q:[[Math.cos(a0)*r0,Math.sin(a0)*r0,z0],[Math.cos(a1)*r0,Math.sin(a1)*r0,z0],
      [Math.cos(a1)*r1,Math.sin(a1)*r1,z1],[Math.cos(a0)*r1,Math.sin(a0)*r1,z1]]});}
 faces.sort(function(a,b){return a.d-b.d;});
 faces.forEach(function(f){
  var P=f.q.map(function(p){return isoP(x,cx,cy,p[0],p[1],p[2]);});
  var gr=x.createLinearGradient(P[0][0],P[0][1],P[3][0],P[3][1]);
  gr.addColorStop(0,lit(col,f.b*.80));gr.addColorStop(.5,lit(col,f.b));gr.addColorStop(1,lit(col,f.b*1.06));
  x.beginPath();x.moveTo(P[0][0],P[0][1]);
  for(var i=1;i<4;i++)x.lineTo(P[i][0],P[i][1]);x.closePath();
  x.fillStyle=gr;x.fill();x.strokeStyle=gr;x.lineWidth=1;x.stroke();});
 if(r1>.001){
  var top=[];
  for(k=0;k<n;k++){var a=k/n*TAU;top.push(isoP(x,cx,cy,Math.cos(a)*r1,Math.sin(a)*r1,z1));}
  var c0=isoP(x,cx,cy,0,0,z1);
  var tg=x.createRadialGradient(c0[0]-r1*22,c0[1]-r1*10,1,c0[0],c0[1],r1*62);
  tg.addColorStop(0,lit(col,1.2));tg.addColorStop(1,lit(col,.96));
  polyFill(x,top,tg,null);}
}
function boxAt(x,cx,cy,i,j,z0,z1,ai,aj,col,noTop){
 var n=18,k,V=[],faces=[];
 for(k=0;k<n;k++){var a=k/n*TAU,ca=Math.cos(a),sa=Math.sin(a);
  var p=Math.pow(Math.pow(Math.abs(ca),4)+Math.pow(Math.abs(sa),4),-.25);
  V.push([ca*ai*p*.93,sa*aj*p*.93]);}
 for(k=0;k<n;k++){
  var A=V[k],Bv=V[(k+1)%n];
  var ex=Bv[0]-A[0],ey=Bv[1]-A[1],nx=ey,ny=-ex,l=hyp(nx,ny)||1;
  nx/=l;ny/=l;if(nx+ny<=-.02)continue;
  faces.push({d:nx+ny,a:A,b:Bv,br:faceShade(nx,ny)});}
 faces.sort(function(p,q){return p.d-q.d;});
 faces.forEach(function(f){
  var P=[isoP(x,cx,cy,i+f.a[0],j+f.a[1],z0),isoP(x,cx,cy,i+f.b[0],j+f.b[1],z0),
         isoP(x,cx,cy,i+f.b[0],j+f.b[1],z1),isoP(x,cx,cy,i+f.a[0],j+f.a[1],z1)];
  var gr=x.createLinearGradient(P[0][0],P[0][1],P[3][0],P[3][1]);
  gr.addColorStop(0,lit(col,f.br*.82));gr.addColorStop(1,lit(col,f.br*1.02));
  polyFill(x,P,gr,gr,1);});
 if(!noTop){
  var T=V.map(function(p){return isoP(x,cx,cy,i+p[0],j+p[1],z1);});
  polyFill(x,T,lit(col,1.07),null);}
}
function shadowEllipse(x,X,Y,w,a){
 x.save();x.translate(X,Y+2);x.scale(1,.4);
 var gr=x.createRadialGradient(0,0,1,0,0,w);
 gr.addColorStop(0,'rgba(0,0,0,'+(a||.45)+')');gr.addColorStop(.55,'rgba(0,0,0,'+((a||.45)*.45)+')');
 gr.addColorStop(1,'rgba(0,0,0,0)');
 x.fillStyle=gr;x.beginPath();x.arc(0,0,w,0,TAU);x.fill();x.restore();
}
function drawColumn(x,X,Y,stoneC,broken){
 var col=stoneC||'#9a93a6';
 shadowEllipse(x,X,Y,42,.5);
 sqBlock(x,X,Y,0,0,0,10,PLINTH,lit(col,.88),true);
 sqBlock(x,X,Y,0,0,10,18,.40,col,true);
 lathe(x,X,Y,18,23,.31,.235,col,ROUND);
 var topZ=broken?48:78;
 lathe(x,X,Y,23,topZ,.235,.205,col,ROUND);
 if(broken){
  var cp=isoP(x,X,Y,0,0,topZ);
  var jg=x.createRadialGradient(cp[0]-4,cp[1]-2,1,cp[0],cp[1],16);
  jg.addColorStop(0,lit(col,1.1));jg.addColorStop(1,lit(col,.62));
  x.fillStyle=jg;x.beginPath();x.ellipse(cp[0],cp[1],15,7,0,0,TAU);x.fill();
  for(var r=0;r<5;r++){var a=r/5*TAU,rr=.34+Math.random()*.16;
   var q2=isoP(x,X,Y,Math.cos(a)*rr,Math.sin(a)*rr,2);
   var rg=x.createRadialGradient(q2[0]-2,q2[1]-2,1,q2[0],q2[1],7);
   rg.addColorStop(0,lit(col,.9));rg.addColorStop(1,lit(col,.45));
   x.fillStyle=rg;x.beginPath();x.ellipse(q2[0],q2[1],5.5,3.2,0,0,TAU);x.fill();}
  return;}
 lathe(x,X,Y,78,83,.225,.245,lit(col,1.05),ROUND);
 lathe(x,X,Y,83,96,.245,.36,lit(col,1.02),ROUND);
 sqBlock(x,X,Y,0,0,96,COL_TOP,ABACUS,lit(col,1.08),true);
}

/* ══════════ 3D → СПРАЙТ ══════════ */
var LIGHT=[-.45,-.72,.55];
(function(){var l=Math.sqrt(LIGHT[0]*LIGHT[0]+LIGHT[1]*LIGHT[1]+LIGHT[2]*LIGHT[2]);LIGHT[0]/=l;LIGHT[1]/=l;LIGHT[2]/=l;})();
function rot(p,c,s){return [p[0]*c-p[1]*s,p[0]*s+p[1]*c,p[2]];}
function prj(p){return [(p[0]-p[1])*.82,(p[0]+p[1])*.42-p[2]];}
function dep(p,c,s){var r=rot(p,c,s);return r[0]+r[1]+r[2]*.02;}
function bright(n,c,s){var r=rot(n,c,s);return .40+.66*Math.max(0,r[0]*LIGHT[0]+r[1]*LIGHT[1]+r[2]*LIGHT[2]);}
function sub(a,b){return [a[0]-b[0],a[1]-b[1],a[2]-b[2]];}
function add(a,b){return [a[0]+b[0],a[1]+b[1],a[2]+b[2]];}
function mul(a,k){return [a[0]*k,a[1]*k,a[2]*k];}
function norm(a){var l=Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2])||1;return [a[0]/l,a[1]/l,a[2]/l];}
function T(a,b,r,c,n,e){return {t:'t',a:a,b:b,r:r,c:c||'#8a8278',n:n||[0,-1,.4],e:e};}
function B(p,r,c,n,e){return {t:'b',p:p,r:r,c:c||'#8a8278',n:n||[0,-1,.5],e:e};}
function Q(pts,c,n,e){return {t:'q',p:pts,c:c||'#8a8278',n:n||[0,-1,0],e:e};}
function drawParts(cx,parts,yaw,ox,oy,sc){
 var c=Math.cos(yaw),s=Math.sin(yaw),i,j,K=sc||1,L=[];
 for(i=0;i<parts.length;i++){
  var p=parts[i],d;
  if(p.t==='t')d=dep(mul(add(p.a,p.b),.5),c,s);
  else if(p.t==='b')d=dep(p.p,c,s);
  else{var acc=0;for(j=0;j<p.p.length;j++)acc+=dep(p.p[j],c,s);d=acc/p.p.length;}
  L.push({p:p,d:d});}
 L.sort(function(a,b){return a.d-b.d;});
 function P(v){var q=prj(rot(v,c,s));return [q[0]*K+ox,q[1]*K+oy];}
 for(i=0;i<L.length;i++){
  var q=L[i].p,f=bright(q.n,c,s);
  if(q.t==='t'){
   var A=P(q.a),Bp=P(q.b),ax=A[0],ay=A[1],bx=Bp[0],by=Bp[1];
   var dx=bx-ax,dy=by-ay,len=Math.sqrt(dx*dx+dy*dy)||1,rr=Math.max(.5,q.r*K);
   var px=-dy/len*rr,py=dx/len*rr;if(py>0){px=-px;py=-py;}
   var gr=cx.createLinearGradient(ax+px,ay+py,ax-px,ay-py);
   gr.addColorStop(0,lit(q.c,f*1.34));gr.addColorStop(.42,lit(q.c,f));gr.addColorStop(1,lit(q.c,f*.46));
   cx.strokeStyle=gr;cx.lineWidth=rr*2;cx.lineCap='round';
   cx.beginPath();cx.moveTo(ax,ay);cx.lineTo(bx,by);cx.stroke();
   cx.strokeStyle='rgba(255,246,225,'+(.10*f)+')';cx.lineWidth=Math.max(.4,rr*.34);
   cx.beginPath();cx.moveTo(ax+px*.55,ay+py*.55);cx.lineTo(bx+px*.55,by+py*.55);cx.stroke();
   if(q.e){cx.save();cx.shadowColor=q.c;cx.shadowBlur=8;cx.strokeStyle=q.c;cx.lineWidth=rr*1.1;
    cx.beginPath();cx.moveTo(ax,ay);cx.lineTo(bx,by);cx.stroke();cx.restore();}
  }else if(q.t==='b'){

function s2t(sx,sy){var wx=sx-VW/2+cam.x,wy=sy-VIEW_H/2+cam.y;return {x:(wx/HW+wy/HH)/2,y:(wy/HH-wx/HW)/2};}
function worldClick(mx,my){
 pend=null;target=null;path=[];walkTo=null;
 var t=s2t(mx,my),tx=Math.floor(t.x),ty=Math.floor(t.y),i;
 for(i=0;i<mons.length;i++){
  var m=mons[i];if(m.dead)continue;
  var sx=(m.x-m.y)*HW-cam.x+VW/2,sy=(m.x+m.y)*HH-cam.y+VIEW_H/2;
  if(Math.abs(mx-sx)<28&&my>sy-84&&my<sy+12){
   marker={x:m.x,y:m.y,t:0,c:'#ff5a4a'};
   if(hyp(m.x-P.x,m.y-P.y)<(P.cls==='warrior'?1.7:7.3))attack(m);
   else{target=m;goTo(Math.floor(m.x),Math.floor(m.y));}return;}}
 if(L.village)for(i=0;i<npcs.length;i++){var n=npcs[i];
  if(hyp(t.x-n.x,t.y-n.y)<.9){marker={x:n.x,y:n.y,t:0,c:'#8fd7ff'};
   if(hyp(P.x-n.x,P.y-n.y)<2.2)openNPC(n);else{goTo(Math.floor(n.x),Math.floor(n.y));pend={k:'npc',n:n};}return;}}
 for(i=0;i<items.length;i++){var it=items[i];
  if(hyp(t.x-it.x,t.y-it.y)<.65){marker={x:it.x,y:it.y,t:0,c:'#8fd7ff'};
   if(hyp(P.x-it.x,P.y-it.y)<1.5)take(it);else{goTo(Math.floor(it.x),Math.floor(it.y));pend={k:'item',it:it};}return;}}
 var tv=tile(tx,ty);
 if(tv===2||tv===3){marker={x:tx+.5,y:ty+.5,t:0,c:'#8fd7ff'};
  if(hyp(P.x-tx-.5,P.y-ty-.5)<1.8)useStair(tv);else{goTo(tx,ty);pend={k:'stair',tv:tv,tx:tx,ty:ty};}return;}
 if(tv===4){marker={x:tx+.5,y:ty+.5,t:0,c:'#8fd7ff'};
  if(hyp(P.x-tx-.5,P.y-ty-.5)<1.9)openChest(tx,ty);
  else{var adj=[[1,0],[-1,0],[0,1],[0,-1]].map(function(o){return [tx+o[0],ty+o[1]];})
   .filter(function(a){return !solid(a[0],a[1]);})[0];
   if(adj){goTo(adj[0],adj[1]);pend={k:'chest',tx:tx,ty:ty};}}return;}
 if(goTo(tx,ty))marker={x:tx+.5,y:ty+.5,t:0,c:'#ffe9b0'};
 else{marker={x:tx+.5,y:ty+.5,t:0,c:'#ff5a4a'};say('Туда нет пути.','#ff6a5a');}
}
function openChest(tx,ty){
 L.grid[ix(tx,ty)]=5;SFX.chest();var d=depth||1;
 items.push({x:tx+.5+rnd(-.2,.2),y:ty+1.15,gold:ri(8,20)*d});
 var r=Math.random();
 if(r<.32)items.push({x:tx+.3,y:ty+1.3,pot:pick(['hp','mp'])});
 if(r<.58&&d>=2)items.push({x:tx+.7,y:ty+1.3,item:equipRoll(d)});
 say('Сундук вскрыт.','#9fb4d8');
}
function take(it){
 var i2=items.indexOf(it);if(i2<0)return;
 if(it.gold){P.gold+=it.gold;items.splice(i2,1);ftext(P.x,P.y-.9,'+'+it.gold,'#ffd75e');SFX.gold();return;}
 if(it.pot){var s=P.belt.indexOf(null);if(s<0){say('Пояс полон.','#ff6a5a');SFX.err();return;}
  P.belt[s]=potion(it.pot);items.splice(i2,1);SFX.pot();return;}
 var b=P.bag.indexOf(null);if(b<0){say('Сума полна.','#ff6a5a');SFX.err();return;}
 P.bag[b]=it.item;items.splice(i2,1);
 if(it.item.slot==='relic'){P.quest=1;say('Реликвия Света найдена!','#ffd75e');SFX.lvl();}
 else{say(it.item.name,'#9fb4d8');SFX.gold();}
}
function useBelt(i){
 var p=P.belt[i];if(!p||P.dead)return;
 if(p.kind==='hp'){var h=Math.round(P.hpM*.5);P.hp=Math.min(P.hpM,P.hp+h);ftext(P.x,P.y-1,'+'+h,'#ff7a6a');}
 else{var m=Math.round(P.mpM*.6);P.mp=Math.min(P.mpM,P.mp+m);ftext(P.x,P.y-1,'+'+m,'#7aa0ff');}
 P.belt[i]=null;SFX.pot();
}
function equipSel(i){
 var it=P.bag[i];if(!it)return;
 if(it.slot!=='weapon'&&it.slot!=='armor'){say('Это нельзя надеть.','#9fb4d8');return;}
 var cur=it.slot==='weapon'?P.weapon:P.armor;
 if(it.slot==='weapon')P.weapon=it;else P.armor=it;
 P.bag[i]=cur||null;recalc();selSlot=-1;SFX.ui();
}
function dropSel(){if(selSlot<0||!P.bag[selSlot])return;
 items.push({x:P.x+rnd(-.4,.4),y:P.y+rnd(.2,.7),item:P.bag[selSlot]});P.bag[selSlot]=null;selSlot=-1;SFX.ui();}
function unequip(slot){
 var it=slot==='weapon'?P.weapon:P.armor;if(!it)return;
 var b=P.bag.indexOf(null);if(b<0){say('Сума полна.','#ff6a5a');return;}
 P.bag[b]=it;if(slot==='weapon')P.weapon=null;else P.armor=null;recalc();SFX.ui();
}
function openNPC(n){
 if(n.k==='sage'){
  var line=P.quest===2?'Ты — свет Хмурдола.':P.quest===1?'Реликвия Света! Отдай её мне.':
   depth>0?'Спустись на последнюю глубину и срази Владыку.':'Под собором пробудилось древнее зло…';
  var opts=[];
  if(P.quest===1)opts.push({t:'Отдать Реликвию Света',fn:function(){
   var s=-1;for(var i=0;i<12;i++)if(P.bag[i]&&P.bag[i].slot==='relic')s=i;
   if(s>=0){P.bag[s]=null;P.quest=2;questDone=true;P.str+=2;P.dex+=2;P.mag+=2;P.vit+=2;recalc();
    P.hp=P.hpM;P.mp=P.mpM;say('+2 ко всем характеристикам!','#ffd75e');SFX.lvl();}dlg=null;}});
  opts.push({t:'Исцеление (даром)',fn:function(){P.hp=P.hpM;P.mp=P.mpM;SFX.lvl();say('Свет коснулся ран.','#9fb4d8');dlg=null;}});
  dlg={n:n.n,line:line,opts:opts};
 }else{
  if(!n.stock)n.stock=[equipRoll(Math.max(1,depth)),equipRoll(Math.max(1,depth)+1),equipRoll(Math.max(1,depth)+2)];
  var o=[{t:'Зелье здоровья — 35',fn:function(){buyPot('hp');}},{t:'Зелье маны — 35',fn:function(){buyPot('mp');}}];
  n.stock.forEach(function(it,i){o.push({t:it.name+' — '+it.price,fn:function(){
   if(P.gold<it.price){say('Не хватает золота.','#ff6a5a');SFX.err();return;}
   var b=P.bag.indexOf(null);if(b<0){say('Сума полна.','#ff6a5a');SFX.err();return;}
   P.gold-=it.price;P.bag[b]=it;n.stock.splice(i,1);SFX.gold();openNPC(n);}});});
  dlg={n:n.n,line:'Лучшая сталь к северу от Пекла.',opts:o};}
}
function buyPot(k){
 if(P.gold<35){say('Не хватает золота.','#ff6a5a');SFX.err();return;}
 var s=P.belt.indexOf(null);if(s<0){say('Пояс полон.','#ff6a5a');SFX.err();return;}
 P.gold-=35;P.belt[s]=potion(k);SFX.gold();
}
function respawn(){P.dead=false;P.gold=Math.floor(P.gold*.75);recalc();
 P.hp=Math.round(P.hpM*.6);P.mp=Math.round(P.mpM*.6);phase='play';travel(0);say('Вы очнулись в Хмурдоле…','#ff6a5a');}
function restart(){LV={};questDone=false;kills=0;P.quest=0;P.dead=false;P.lvl=1;P.xp=0;P.gold=60;
 P.bag=new Array(12).fill(null);panelMenu=false;panelInv=false;panelChar=false;dlg=null;

 P.belt[0]=potion('hp');P.belt[1]=potion(c==='mage'?'mp':'hp');P.belt[2]=null;P.belt[3]=null;

function update(dt){
 elapsed+=dt;var i;
 if(marker){marker.t+=dt;if(marker.t>.7)marker=null;}
 if(roomLabelT>0)roomLabelT-=dt;
 for(i=msgQ.length-1;i>=0;i--){msgQ[i].life-=dt;if(msgQ[i].life<=0)msgQ.splice(i,1);}
 if(phase!=='play')return;
 P.atkT=Math.max(0,P.atkT-dt);P.skillCd=Math.max(0,P.skillCd-dt);
 if(P.act!=='idle'&&P.act!=='walk'){P.actT+=dt;
  var dur=P.act==='death'?1.1:(P.act==='cast'?.5:.45);
  if(P.actT>=dur&&P.act!=='death')P.act='idle';}
 if(!P.dead){P.mp=Math.min(P.mpM,P.mp+({warrior:.7,rogue:1,mage:1.8}[P.cls]+P.bMag*.02)*dt);
  P.hp=Math.min(P.hpM,P.hp+(.35+P.bVit*.012)*dt);}
 var mx=0,my=0;
 var kx=(keys['d']||keys['arrowright']?1:0)-(keys['a']||keys['arrowleft']?1:0);
 var ky=(keys['s']||keys['arrowdown']?1:0)-(keys['w']||keys['arrowup']?1:0);
 if(P.dead){kx=0;ky=0;path=[];walkTo=null;target=null;}
 if(kx||ky){path=[];walkTo=null;target=null;pend=null;
  var dx=(kx+2*ky)/2,dy=(2*ky-kx)/2,l=hyp(dx,dy)||1;
  mx=dx/l*3.5*dt;my=dy/l*3.5*dt;P.face=Math.atan2(dy,dx);
 }else if(!P.dead){
  if(target){
   if(target.dead)target=null;
   else{var d=hyp(target.x-P.x,target.y-P.y);P.face=Math.atan2(target.y-P.y,target.x-P.x);
    var rng=P.cls==='warrior'?1.5:7;
    if(d<=rng){path=[];walkTo=null;if(P.atkT<=0)attack(target);}
    else if(elapsed-pathT>.35||(!path.length&&!walkTo)){pathT=elapsed;
     var pp=findPath(Math.floor(P.x),Math.floor(P.y),Math.floor(target.x),Math.floor(target.y));
     if(pp.length){path=pp;walkTo=null;}else{path=[];walkTo={x:target.x,y:target.y};}}}}
  if(path.length){var w=path[0],ddx=w.x-P.x,ddy=w.y-P.y,dd=hyp(ddx,ddy);
   if(dd<.16)path.shift();else{mx=ddx/dd*3.5*dt;my=ddy/dd*3.5*dt;P.face=Math.atan2(ddy,ddx);}}
  else if(walkTo){var ex=walkTo.x-P.x,ey=walkTo.y-P.y,el=hyp(ex,ey);
   if(el<.28)walkTo=null;else{mx=ex/el*3.5*dt;my=ey/el*3.5*dt;P.face=Math.atan2(ey,ex);}}}
 if((mx||my)&&!P.dead){
  var ox=P.x,oy=P.y;move(P,mx,my);P.moving=true;P.anim+=dt*8.5;
  if(P.act==='idle')P.act='walk';
  if(path.length&&Math.abs(P.x-ox)<Math.abs(mx)*.3&&Math.abs(P.y-oy)<Math.abs(my)*.3)path=[];
  if(Math.floor(P.x)!==Math.floor(ox)||Math.floor(P.y)!==Math.floor(oy)){reveal();
   if(L.rooms)for(i=0;i<L.rooms.length;i++){var rr=L.rooms[i];
    if(P.x>=rr.x&&P.x<rr.x+rr.w&&P.y>=rr.y&&P.y<rr.y+rr.h){
     if(roomLabel!==ROOMNAME[rr.kind]){roomLabel=ROOMNAME[rr.kind]||'';roomLabelT=3.4;}break;}}}
 }else{P.moving=false;if(P.act==='walk')P.act='idle';}
 if(!path.length&&!target&&pend){
  if(pend.k==='chest'&&hyp(P.x-pend.tx-.5,P.y-pend.ty-.5)<1.9&&tile(pend.tx,pend.ty)===4)openChest(pend.tx,pend.ty);
  else if(pend.k==='npc'&&hyp(P.x-pend.n.x,P.y-pend.n.y)<2.2)openNPC(pend.n);
  else if(pend.k==='item'&&items.indexOf(pend.it)>=0&&hyp(P.x-pend.it.x,P.y-pend.it.y)<1.5)take(pend.it);
  else if(pend.k==='stair'&&hyp(P.x-pend.tx-.5,P.y-pend.ty-.5)<1.8){var pv=pend.tv;pend=null;useStair(pv);return;}
  pend=null;}
 for(i=items.length-1;i>=0;i--){var it=items[i];
  if(it.gold&&hyp(P.x-it.x,P.y-it.y)<.85&&!P.dead){P.gold+=it.gold;ftext(P.x,P.y-.9,'+'+it.gold,'#ffd75e');SFX.gold();items.splice(i,1);}}
 for(i=corpses.length-1;i>=0;i--){corpses[i].t-=dt;if(corpses[i].t<=0)corpses.splice(i,1);}
 for(i=0;i<mons.length;i++){
  var m=mons[i];
  if(m.dead){m.dying-=dt*1.6;m.actT+=dt;if(m.dying<0)m.dying=0;continue;}
  m.flash=Math.max(0,m.flash-dt);m.atk=Math.max(0,m.atk-dt);
  var md=hyp(P.x-m.x,P.y-m.y);
  if(m.st==='idle'&&md<m.ag&&!P.dead){
   m.st='chase';
   if(m.type==='skeleton')m.rise=.75;
   if(m.type==='fallen')mons.forEach(function(o){if(!o.dead&&o.type==='fallen'&&hyp(o.x-m.x,o.y-m.y)<6)o.st='chase';});
   if(m.uniq){say(m.n+': СВЕЖЕЕ МЯСО!','#ff5a4a');SFX.roar();}
   if(m.boss){SFX.boss();bossRef=m;}}
  if(m.act==='attack'){m.actT+=dt;if(m.actT>.4)m.act='idle';}
  if(m.st!=='chase'||P.dead){if(m.act!=='attack')m.act='idle';continue;}
  var ang=Math.atan2(P.y-m.y,P.x-m.x);m.face=ang;
  if(m.rise>0){m.rise-=dt;m.act='idle';continue;}
  if(m.stone){m.wake+=dt;if(m.wake>.6)m.stone=false;m.act='idle';continue;}
  if(m.type==='fallen'&&m.hp<m.hpM*.3){m.flee+=dt;
   move(m,-Math.cos(ang)*m.spd*dt,-Math.sin(ang)*m.spd*dt);m.anim+=dt*9;m.act='walk';
   if(m.flee>2.6)m.flee=0;continue;}
  if(m.type==='scavenger'&&m.hp<m.hpM&&corpses.length){
   var bc=null,bd2=6;
   corpses.forEach(function(c){var dd=hyp(c.x-m.x,c.y-m.y);if(dd<bd2){bd2=dd;bc=c;}});
   if(bc){if(bd2>.6){var ca=Math.atan2(bc.y-m.y,bc.x-m.x);move(m,Math.cos(ca)*m.spd*dt,Math.sin(ca)*m.spd*dt);m.face=ca;}
    else{m.hp=Math.min(m.hpM,m.hp+9*dt);bc.t-=dt*4;if(Math.random()<.12)blood(bc.x,bc.y,'#7a1010',2);}
    m.anim+=dt*9;m.act='walk';if(md>1.4)continue;}}
  if(m.uniq){m.chT-=dt;
   if(m.chT<=0&&md>2&&md<8.5){m.chg=.7;m.chT=rnd(3.5,5);SFX.roar();}
   if(m.chg>0){m.chg-=dt;move(m,Math.cos(ang)*m.spd*2.2*dt,Math.sin(ang)*m.spd*2.2*dt);
    m.anim+=dt*13;m.act='walk';
    if(md<1.25&&m.atk<=0){m.atk=1;m.act='attack';m.actT=0;hurt(ri(m.dmg[0],m.dmg[1]),m.n);}continue;}}
  if(m.ranged||m.boss){
   m.shT-=dt;
   if(md<2)move(m,-Math.cos(ang)*m.spd*dt*.7,-Math.sin(ang)*m.spd*dt*.7);
   else if(md>5.5)move(m,Math.cos(ang)*m.spd*dt,Math.sin(ang)*m.spd*dt);
   m.anim+=dt*7;m.act=(md<5.5&&md>2)?'idle':'walk';
   if(m.shT<=0&&md<8.5){m.shT=m.boss?1.35:rnd(1.4,2.2);m.act='attack';m.actT=0;
    shoot(m.x,m.y-.35,ang,5.6,ri(m.dmg[0],m.dmg[1]),false,'bolt',m.bc||'#ff5030');tone(500,.1,'triangle',.05,-300);}
   if(m.boss){m.ringT-=dt;
    if(m.ringT<=0&&md<9.5){m.ringT=4;
     for(var q=0;q<10;q++)shoot(m.x,m.y-.3,q/10*TAU,4.6,Math.round(ri(m.dmg[0],m.dmg[1])*.7),false,'bolt','#ff5030');
     SFX.fire();}}
   if(md<1.15&&m.atk<=0){m.atk=1.1;m.act='attack';m.actT=0;hurt(ri(m.dmg[0],m.dmg[1]),m.n);}
  }else{
   if(md>.95){move(m,Math.cos(ang)*m.spd*dt*(m.boss&&m.hp<m.hpM*.3?1.5:1),Math.sin(ang)*m.spd*dt);
    m.anim+=dt*(m.type==='zombie'?4:8);m.act='walk';}
   else if(m.act!=='attack')m.act='idle';
   if(md<1.15&&m.atk<=0){m.atk=1.1;m.act='attack';m.actT=0;hurt(ri(m.dmg[0],m.dmg[1]),m.n);}}

function wrapText(t,x,y,maxW,lh,c){

 g.font='italic 13px Georgia';g.textAlign='left';
 for(var i=0;i<words.length;i++){var test=line+words[i]+' ';
  if(g.measureText(test).width>maxW&&i>0){g.fillStyle=c;g.fillText(line,x,yy);line=words[i]+' ';yy+=lh;}
  else line=test;}
 g.fillStyle=c;g.fillText(line,x,yy);
}

var TASKS=[],taskI=0;
function buildTasks(){
 TASKS=[];
 Object.keys(THEMES).forEach(function(th){TASKS.push({t:'замыкание текстуры: '+THEMES[th].name+'…',f:function(){bakeTheme(th);}});});
 TASKS.push({t:'колонны: плинф и абака…',f:function(){bakeProps();}});
 TASKS.push({t:'сундуки и монеты…',f:function(){bakeChests();}});
 TASKS.push({t:'кровли и утварь…',f:function(){bakeRoofs();}});
 TASKS.push({t:'декали, тени, зерно…',f:function(){bakeDecals();bakeAO();bakeGrain();}});
 TASKS.push({t:'коватьёж панели…',f:function(){PANEL=bakePanel();TITLEBG=bakeTitle();bakeIcons();bakeNPC();}});
 ['warrior','rogue','mage'].forEach(function(c){TASKS.push({t:'рендер героя: '+CLSN[c]+'…',f:function(){bakeType(c,true);}});});
 Object.keys(MOBS).forEach(function(k){TASKS.push({t:'рендер твари: '+MOBS[k].n+'…',f:function(){bakeType(k,false);}});});
}
function stepLoad(){if(taskI<TASKS.length){loadTxt=TASKS[taskI].t;TASKS[taskI].f();taskI++;loadP=taskI/TASKS.length;}}
var last=performance.now(),errOnce=false;
function frame(now){
 var dt=Math.min(.05,(now-last)/1000);last=now;
 try{
  if(phase==='load'){
   var t0=performance.now();
   while(taskI<TASKS.length&&performance.now()-t0<24)stepLoad();
   if(taskI>=TASKS.length){phase='title';drawTitle();}else drawLoading();
  }else{
   update(dt*(phase==='play'?gameSpeed:1));
   tipItem=null;
   if(phase==='title')drawTitle();
   else{
    drawWorld();drawBossBar();
    if(panelChar)drawCharPanel();
    if(panelInv)drawInvPanel();
    if(panelMap)drawMap();
    drawUI();
    if(dlg)drawDialog();
    if(panelMenu)drawMenu();
    drawTip();
    if(phase==='dead')drawEnd(false);
    else if(phase==='win')drawEnd(true);
    else drawCursor();}}
  octx.drawImage(buf,0,0);
 }catch(e){
  if(!errOnce){errOnce=true;octx.fillStyle='#400';octx.fillRect(0,0,VW,24);
   octx.fillStyle='#fff';octx.font='13px monospace';octx.fillText('ERR: '+(e.message||e),8,17);}}
 requestAnimationFrame(frame);
}
buildTasks();
requestAnimationFrame(frame);
})();
