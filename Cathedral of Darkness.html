var BAY=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
function dither(cv,warm){

  p[i]=cl(Math.round((r+th)/36)*36,0,255);

/* ══════════ 3D → СПРАЙТ ══════════ */
var LIGHT=[-.45,-.72,.55];
(function(){var l=Math.sqrt(LIGHT[0]*LIGHT[0]+LIGHT[1]*LIGHT[1]+LIGHT[2]*LIGHT[2]);LIGHT[0]/=l;LIGHT[1]/=l;LIGHT[2]/=l;})();
function rot(p,c,s){return [p[0]*c-p[1]*s,p[0]*s+p[1]*c,p[2]];}
function prj(p){return [(p[0]-p[1])*.82,(p[0]+p[1])*.42-p[2]];}
function dep(p,c,s){var r=rot(p,c,s);return r[0]+r[1]+r[2]*.02;}
function bright(n,c,s){var r=rot(n,c,s);return .40+.66*Math.max(0,r[0]*LIGHT[0]+r[1]*LIGHT[1]+r[2]*LIGHT[2]);}
function sub(a,b){return [a[0]-b[0],a[1]-b[1],a[2]-b[2]];}
function add(a,b){return [a[0]+b[0],a[1]+b[1],a[2]+b[2]];}
function mul(a,k){return [a[0]*k,a[1]*k,a[2]*k];}
function norm(a){var l=Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2])||1;return [a[0]/l,a[1]/l,a[2]/l];}
function T(a,b,r,c,n,e){return {t:'t',a:a,b:b,r:r,c:c||'#8a8278',n:n||[0,-1,.4],e:e};}
function B(p,r,c,n,e){return {t:'b',p:p,r:r,c:c||'#8a8278',n:n||[0,-1,.5],e:e};}
function Q(pts,c,n,e){return {t:'q',p:pts,c:c||'#8a8278',n:n||[0,-1,0],e:e};}
function drawParts(cx,parts,yaw,ox,oy,sc){
 var c=Math.cos(yaw),s=Math.sin(yaw),i,j,K=sc||1;
 var L=[];
 for(i=0;i<parts.length;i++){
  var p=parts[i],d;
  if(p.t==='t')d=dep(mul(add(p.a,p.b),.5),c,s);
  else if(p.t==='b')d=dep(p.p,c,s);
  else{var acc=0;for(j=0;j<p.p.length;j++)acc+=dep(p.p[j],c,s);d=acc/p.p.length;}
  L.push({p:p,d:d});
 }
 L.sort(function(a,b){return a.d-b.d;});
 function P(v){var q=prj(rot(v,c,s));return [q[0]*K+ox,q[1]*K+oy];}
 for(i=0;i<L.length;i++){
  var q=L[i].p,f=bright(q.n,c,s);
  if(q.t==='t'){
   var A=P(q.a),Bp=P(q.b);
   var ax=A[0],ay=A[1],bx=Bp[0],by=Bp[1];
   var dx=bx-ax,dy=by-ay,len=Math.sqrt(dx*dx+dy*dy)||1,rr=Math.max(.5,q.r*K);
   var px=-dy/len*rr,py=dx/len*rr;
   if(py>0){px=-px;py=-py;}
   var gr=cx.createLinearGradient(ax+px,ay+py,ax-px,ay-py);
   gr.addColorStop(0,lit(q.c,f*1.34));gr.addColorStop(.42,lit(q.c,f));gr.addColorStop(1,lit(q.c,f*.46));
   cx.strokeStyle=gr;cx.lineWidth=rr*2;cx.lineCap='round';
   cx.beginPath();cx.moveTo(ax,ay);cx.lineTo(bx,by);cx.stroke();
   cx.strokeStyle='rgba(255,246,225,'+(.10*f)+')';cx.lineWidth=Math.max(.4,rr*.34);
   cx.beginPath();cx.moveTo(ax+px*.55,ay+py*.55);cx.lineTo(bx+px*.55,by+py*.55);cx.stroke();
   if(q.e){cx.save();cx.shadowColor=q.c;cx.shadowBlur=8;cx.strokeStyle=q.c;cx.lineWidth=rr*1.1;
    cx.beginPath();cx.moveTo(ax,ay);cx.lineTo(bx,by);cx.stroke();cx.restore();}
  }else if(q.t==='b'){
   var Pp=P(q.p),x=Pp[0],y=Pp[1],r=Math.max(.5,q.r*K);
   var g2=cx.createRadialGradient(x-r*.36,y-r*.42,r*.08,x,y,r*1.06);
   g2.addColorStop(0,lit(q.c,f*1.5));g2.addColorStop(.52,lit(q.c,f));g2.addColorStop(1,lit(q.c,f*.42));
   cx.fillStyle=g2;cx.beginPath();cx.arc(x,y,r,0,6.2832);cx.fill();
   if(q.e){cx.save();cx.shadowColor=q.c;cx.shadowBlur=9;cx.fillStyle=q.c;
    cx.beginPath();cx.arc(x,y,r*.74,0,6.2832);cx.fill();cx.restore();}
  }else{
   cx.beginPath();
   for(var k=0;k<q.p.length;k++){var V=P(q.p[k]);if(k===0)cx.moveTo(V[0],V[1]);else cx.lineTo(V[0],V[1]);}
   cx.closePath();cx.fillStyle=lit(q.c,f);cx.fill();
   cx.strokeStyle=lit(q.c,f*.42);cx.lineWidth=.8;cx.stroke();
   if(q.e){cx.save();cx.shadowColor=q.c;cx.shadowBlur=7;cx.fill();cx.restore();}
  }
 }
}
function pose(act,ph,t,S){
 var i,sg2,P={};
 var bob=(act==='walk')?Math.abs(Math.sin(ph))*1.1:0;
 var lean=(act==='walk')?.7:0;
 P.pelvis=[0,0,20*S+bob];P.chest=[0,lean*.4,30*S+bob];P.neck=[0,lean*.6,35.5*S+bob];P.head=[0,lean*.8,40.5*S+bob];
 P.shL=[-5*S,lean*.4,33.5*S+bob];P.shR=[5*S,lean*.4,33.5*S+bob];
 P.hiL=[-3*S,0,19.5*S+bob];P.hiR=[3*S,0,19.5*S+bob];
 for(i=0;i<2;i++){
  sg2=i?1:-1;var phs=ph+(i?0:Math.PI);
  var sw=(act==='walk')?Math.sin(phs):0;
  var ft=[sg2*3*S,sw*6.2*S,Math.max(0,Math.sin(phs))*3.2*S];
  var kn=[sg2*3*S,sw*3.2*S+1.1*S,10*S+Math.max(0,Math.sin(phs))*1.4*S];
  if(i){P.ftR=ft;P.knR=kn;}else{P.ftL=ft;P.knL=kn;}
 }
 var asw=(act==='walk')?Math.sin(ph+Math.PI)*.55:0;
 P.elL=[-6.2*S,asw*4*S,27.5*S+bob];P.haL=[-5.6*S,asw*7.5*S,21.5*S+bob];
 P.elR=[6.2*S,-asw*4*S,27.5*S+bob];P.haR=[5.6*S,-asw*7.5*S,21.5*S+bob];
 if(act==='attack'){
  var a=-1.35+t*2.75;
  P.elR=[5.4*S,Math.sin(a)*4.5*S,31*S+Math.cos(a)*3.5*S];
  P.haR=[4.6*S+Math.cos(a)*1.5*S,Math.sin(a)*10.5*S,29*S+Math.cos(a)*7.5*S];
  P.chest[1]=1.2*S;P.head[1]=1.4*S;
 }
 if(act==='cast'){
  P.elL=[-5.4*S,4*S,29*S];P.haL=[-4.2*S,8.5*S,32*S];
  P.elR=[5.4*S,4*S,29*S];P.haR=[4.2*S,8.5*S,32*S];
 }
 if(act==='death'){
  for(var key in P){var p=P[key];
   P[key]=[p[0]*(1+t*.35),p[1]+t*(p[2]*.55)+t*2,p[2]*(1-t*.86)+1.5];}
 }

}

function buildParts(type,act,ph,t){
 var C=CFG[type],parts=[],S=C.sc,P,i;
 if(C.fam==='beast'){
  var st=(act==='walk')?Math.sin(ph):0,st2=(act==='walk')?Math.sin(ph+Math.PI):0;
  var dz=(act==='death')?t:0,bz=13*S*(1-dz*.8)+1;

  parts.push(B(add(head,[1.5*S,2.4*S,1.4*S]),.85*S,C.eye,[0,1,.4],1));

  for(i=0;i<3;i++)parts.push(Q([add(head,[(-.8+i*.8)*S,5.4*S,-1.2*S]),add(head,[(-.5+i*.8)*S,5.6*S,-2.6*S]),add(head,[(-.2+i*.8)*S,5.4*S,-1.2*S])],'#e6e2d2',[0,1,-.3]));

   if(!dx&&!dy)continue;var nx=cx+dx,ny=cy+dy;

function update(dt){
 elapsed+=dt;
 var i;
 if(marker){marker.t+=dt;if(marker.t>.7)marker=null;}
 if(roomLabelT>0)roomLabelT-=dt;
 for(i=msgQ.length-1;i>=0;i--){msgQ[i].life-=dt;if(msgQ[i].life<=0)msgQ.splice(i,1);}
 if(phase!=='play')return;
 P.atkT=Math.max(0,P.atkT-dt);P.skillCd=Math.max(0,P.skillCd-dt);
 if(P.act!=='idle'&&P.act!=='walk'){
  P.actT+=dt;
  var dur=P.act==='death'?1.1:(P.act==='cast'?.5:.45);
  if(P.actT>=dur&&P.act!=='death')P.act='idle';
 }
 if(!P.dead){
  P.mp=Math.min(P.mpM,P.mp+({warrior:.7,rogue:1,mage:1.8}[P.cls]+P.bMag*.02)*dt);
  P.hp=Math.min(P.hpM,P.hp+(.35+P.bVit*.012)*dt);
 }
 var mx=0,my=0;
 var kx=(keys['d']||keys['arrowright']?1:0)-(keys['a']||keys['arrowleft']?1:0);
 var ky=(keys['s']||keys['arrowdown']?1:0)-(keys['w']||keys['arrowup']?1:0);
 if(P.dead){kx=0;ky=0;path=[];walkTo=null;target=null;}
 if(kx||ky){
  path=[];walkTo=null;target=null;pend=null;
  var dx=(kx+2*ky)/2,dy=(2*ky-kx)/2,l=hyp(dx,dy)||1;
  mx=dx/l*3.5*dt;my=dy/l*3.5*dt;P.face=Math.atan2(dy,dx);
 }else if(!P.dead){
  if(target){
   if(target.dead)target=null;
   else{
    var d=hyp(target.x-P.x,target.y-P.y);
    P.face=Math.atan2(target.y-P.y,target.x-P.x);
    var rng=P.cls==='warrior'?1.5:7;
    if(d<=rng){path=[];walkTo=null;if(P.atkT<=0)attack(target);}
    else if(elapsed-pathT>.35||(!path.length&&!walkTo)){
     pathT=elapsed;
     var pp=findPath(Math.floor(P.x),Math.floor(P.y),Math.floor(target.x),Math.floor(target.y));
     if(pp.length){path=pp;walkTo=null;}else{path=[];walkTo={x:target.x,y:target.y};}
    }
   }
  }
  if(path.length){
   var w=path[0],ddx=w.x-P.x,ddy=w.y-P.y,dd=hyp(ddx,ddy);
   if(dd<.16)path.shift();
   else{mx=ddx/dd*3.5*dt;my=ddy/dd*3.5*dt;P.face=Math.atan2(ddy,ddx);}
  }else if(walkTo){
   var ex=walkTo.x-P.x,ey=walkTo.y-P.y,el=hyp(ex,ey);
   if(el<.28)walkTo=null;
   else{mx=ex/el*3.5*dt;my=ey/el*3.5*dt;P.face=Math.atan2(ey,ex);}
  }
 }
 if((mx||my)&&!P.dead){
  var ox=P.x,oy=P.y;move(P,mx,my);P.moving=true;P.anim+=dt*8.5;
  if(P.act==='idle')P.act='walk';
  if(path.length&&Math.abs(P.x-ox)<Math.abs(mx)*.3&&Math.abs(P.y-oy)<Math.abs(my)*.3)path=[];
  if(Math.floor(P.x)!==Math.floor(ox)||Math.floor(P.y)!==Math.floor(oy)){
   reveal();
   if(L.rooms)for(i=0;i<L.rooms.length;i++){var rr=L.rooms[i];
    if(P.x>=rr.x&&P.x<rr.x+rr.w&&P.y>=rr.y&&P.y<rr.y+rr.h){
     if(roomLabel!==ROOMNAME[rr.kind]){roomLabel=ROOMNAME[rr.kind]||'';roomLabelT=3.4;}
     break;}}
  }
 }else{P.moving=false;if(P.act==='walk')P.act='idle';}
 if(!path.length&&!target&&pend){
  if(pend.k==='chest'&&hyp(P.x-pend.tx-.5,P.y-pend.ty-.5)<1.9&&tile(pend.tx,pend.ty)===4)openChest(pend.tx,pend.ty);
  else if(pend.k==='npc'&&hyp(P.x-pend.n.x,P.y-pend.n.y)<2)openNPC(pend.n);
  else if(pend.k==='item'&&items.indexOf(pend.it)>=0&&hyp(P.x-pend.it.x,P.y-pend.it.y)<1.5)take(pend.it);
  else if(pend.k==='stair'&&hyp(P.x-pend.tx-.5,P.y-pend.ty-.5)<1.8){var pv=pend.tv;pend=null;useStair(pv);return;}
  pend=null;
 }
 for(i=items.length-1;i>=0;i--){
  var it=items[i];
  if(it.gold&&hyp(P.x-it.x,P.y-it.y)<.85&&!P.dead){
   P.gold+=it.gold;ftext(P.x,P.y-.9,'+'+it.gold,'#ffd75e');SFX.gold();items.splice(i,1);}
 }
 for(i=corpses.length-1;i>=0;i--){corpses[i].t-=dt;if(corpses[i].t<=0)corpses.splice(i,1);}
 for(i=0;i<mons.length;i++){

 TASKS.push({t:'коватьёж панели…',f:function(){PANEL=bakePanel();TITLEBG=bakeTitle();bakeIcons();bakeNPC();}});
 ['warrior','rogue','mage'].forEach(function(c){TASKS.push({t:'рендер героя: '+CLSN[c]+'…',f:function(){bakeType(c,true);}});});
 Object.keys(MOBS).forEach(function(k){TASKS.push({t:'рендер твари: '+MOBS[k].n+'…',f:function(){bakeType(k,false);}});});
}
function stepLoad(){
 if(taskI<TASKS.length){loadTxt=TASKS[taskI].t;TASKS[taskI].f();taskI++;loadP=taskI/TASKS.length;}
}
var last=performance.now(),errOnce=false;
function frame(now){
 var dt=Math.min(.05,(now-last)/1000);last=now;
 try{
  if(phase==='load'){
   var t0=performance.now();
   while(taskI<TASKS.length&&performance.now()-t0<24)stepLoad();
   if(taskI>=TASKS.length){phase='title';drawTitle();}else drawLoading();
  }else{
   update(dt*(phase==='play'?gameSpeed:1));
   tipItem=null;
   if(phase==='title')drawTitle();
   else{
    drawWorld();drawBossBar();
    if(panelChar)drawCharPanel();
    if(panelInv)drawInvPanel();
    if(panelMap)drawMap();
    drawUI();
    if(dlg)drawDialog();
    if(panelMenu)drawMenu();
    drawTip();
    if(phase==='dead')drawEnd(false);
    else if(phase==='win')drawEnd(true);
    else drawCursor();
   }
  }
  octx.drawImage(buf,0,0);
 }catch(e){
  if(!errOnce){errOnce=true;
   octx.fillStyle='#400';octx.fillRect(0,0,VW,24);
   octx.fillStyle='#fff';octx.font='13px monospace';octx.fillText('ERR: '+(e.message||e),8,17);}
 }
 requestAnimationFrame(frame);
}
buildTasks();
requestAnimationFrame(frame);
})();
</script>
